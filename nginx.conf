server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /env-config.js {
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = / {
        return 404;
    }

    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/ /404.html =404;
    }
}
